# Feature #80: every push runs the tests and a production build, so a broken change is caught before Vercel ships it.
name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build | tee build.log
      # Feature #98: keep pages fast. Fails if a public page ships more than 200 kB of JavaScript.
      - run: node scripts/speed-budget.mjs build.log
